[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markov-algorithms"
dynamic = ["version"]
description = "Simple pure Python command-line Markov's Normal Alrogithmss interpreter"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Fr. Br. George", email = "frbrgeorge@gmail.com"}
]
keywords = ["markov", "interpreter", "theoretical-computer-science", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
markov-algorithms = "markov_algorithms.__main__:main"

[tool.setuptools.package-dir]
markov_algorithms = "markov_algorithms"

[tool.setuptools.dynamic]
version = {attr = "markov_algorithms.__version__.VERSION"}
